# スキルと資格
#
# stars: 3 → ★★★ / 2 → ★★☆ / 1 → ★☆☆
# items に足すだけで追加できます。# を含む名前（C# など）は "" で囲んでください

groups:
  - stars: 3
    means: 設計・ライブラリ開発および、技術指導が可能
    items: [Unity（3D）, "C#"]

  - stars: 2
    means: ドキュメントを見ずにひと通りの実装が可能
    items: [Unity（xR）, Java, HTML / CSS, UIデザイン, C・C++, VBA（Excel）]

  - stars: 1
    means: 調べながらであれば実装・修正が可能
    items: [Shader（HLSL）, TypeScript, JavaScript, Go, Figma, HSP（マイコン用）]

# 資格。1行コピーして足すだけで追加できます
