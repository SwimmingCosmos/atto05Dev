<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-label="しなだマンの中テレ占拠！ のプレースホルダー画像">
  <defs>
    <pattern id="g" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0v64" fill="none" stroke="#242a36" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="18%" r="62%">
      <stop offset="0%" stop-color="#38d6ff" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#38d6ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="1000" fill="#10131a"/>
  <rect width="1600" height="1000" fill="url(#g)"/>
  <rect width="1600" height="1000" fill="url(#glow)"/>
  <g font-family="Hiragino Sans, Noto Sans JP, sans-serif" text-anchor="middle">
    <text x="800" y="470" fill="#e9ecf1" font-size="64" font-weight="700">しなだマンの中テレ占拠！</text>
